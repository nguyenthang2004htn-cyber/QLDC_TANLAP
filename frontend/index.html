<body>
  <div id="root"></div>
  <script>
    window.addEventListener('error', function(e) {
      document.body.innerHTML += '<div style="color: red; position: fixed; top: 0; left: 0; background: white; padding: 20px; z-index: 9999; font-family: sans-serif;">' + e.message + '<br>' + e.filename + ':' + e.lineno + '</div>';
    });
  </script>
